
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEGENDS OF ABDE</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  background: #9bdcff;
  font-family: Arial, sans-serif;
  color: white;
}

canvas {
  display: block;
}

#menu {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(
    135deg,
    rgba(4, 20, 45, .88),
    rgba(0, 100, 160, .65)
  );
}

.panel {
  width: min(90%, 440px);
  padding: 35px;
  text-align: center;
  border: 2px solid #4deaff;
  border-radius: 22px;
  background: rgba(5, 25, 50, .92);
  box-shadow: 0 0 35px #00cfff66;
}

h1 {
  margin: 0 0 12px;
  color: #55edff;
  font-size: clamp(30px, 7vw, 48px);
}

button {
  margin-top: 20px;
  padding: 15px 30px;
  border: 0;
  border-radius: 10px;
  background: #12d9ef;
  color: #00213b;
  font-weight: bold;
  font-size: 18px;
  cursor: pointer;
}

button:hover {
  background: white;
}

#hud {
  position: fixed;
  z-index: 2;
  top: 15px;
  left: 15px;
  padding: 14px 18px;
  border: 1px solid #72edff;
  border-radius: 12px;
  background: #05264dcc;
  line-height: 1.8;
  pointer-events: none;
}

#crosshair {
  position: fixed;
  z-index: 2;
  left: 50%;
  top: 50%;
  width: 12px;
  height: 12px;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

#crosshair::before,
#crosshair::after {
  content: "";
  position: absolute;
  background: white;
  box-shadow: 0 0 5px #00cfff;
}

#crosshair::before {
  width: 2px;
  height: 12px;
  left: 5px;
}

#crosshair::after {
  width: 12px;
  height: 2px;
  top: 5px;
}

#message {
  position: fixed;
  z-index: 3;
  bottom: 35px;
  width: 100%;
  text-align: center;
  color: white;
  text-shadow: 0 2px 5px black;
  pointer-events: none;
}

#hint {
  position: fixed;
  z-index: 2;
  right: 15px;
  bottom: 15px;
  padding: 10px;
  border-radius: 8px;
  background: #05264dcc;
  font-size: 13px;
  pointer-events: none;
}
</style>
</head>

<body>

<div id="menu">
  <div class="panel">
    <h1>LEGENDS OF ABDE</h1>
    <p>Explora la arena, encuentra los cristales y consigue puntos.</p>
    <p><b>W A S D</b> — Moverse</p>
    <p><b>RATÓN</b> — Mirar alrededor</p>
    <p><b>ESPACIO</b> — Saltar</p>
    <p><b>SHIFT</b> — Correr</p>
    <button id="play">ENTRAR EN LA ARENA</button>
  </div>
</div>

<div id="hud">
  <b>LEGENDS OF ABDE</b><br>
  Cristales: <span id="score">0</span><br>
  Estado: <span id="status">Preparado</span>
</div>

<div id="crosshair"></div>
<div id="message">¡Encuentra los cristales luminosos!</div>
<div id="hint">WASD: mover · ESPACIO: saltar · ESC: menú</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
(() => {
  const menu = document.getElementById("menu");
  const playButton = document.getElementById("play");
  const scoreText = document.getElementById("score");
  const statusText = document.getElementById("status");
  const message = document.getElementById("message");

  if (!window.THREE) {
    message.textContent = "No se ha podido cargar Three.js. Recarga la página.";
    return;
  }

  // ESCENA
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9bdcff);
  scene.fog = new THREE.Fog(0x9bdcff, 65, 145);

  const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    250
  );

  camera.rotation.order = "YXZ";

  const renderer = new THREE.WebGLRenderer({
    antialias: true
  });

  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.25;
  document.body.appendChild(renderer.domElement);

  // ILUMINACIÓN: el mapa no estará oscuro
  scene.add(new THREE.HemisphereLight(0xdaf5ff, 0x617b99, 2.2));

  const sunlight = new THREE.DirectionalLight(0xffffff, 3);
  sunlight.position.set(-25, 45, 20);
  sunlight.castShadow = true;
  sunlight.shadow.mapSize.set(2048, 2048);
  sunlight.shadow.camera.left = -55;
  sunlight.shadow.camera.right = 55;
  sunlight.shadow.camera.top = 55;
  sunlight.shadow.camera.bottom = -55;
  scene.add(sunlight);

  const blueLight = new THREE.PointLight(0x00d9ff, 80, 65);
  blueLight.position.set(-20, 8, 0);
  scene.add(blueLight);

  const pinkLight = new THREE.PointLight(0xff66d9, 65, 60);
  pinkLight.position.set(20, 7, -15);
  scene.add(pinkLight);

  // MATERIALES
  const floorMat = new THREE.MeshStandardMaterial({
    color: 0x9caebe,
    roughness: 0.82
  });

  const wallMat = new THREE.MeshStandardMaterial({
    color: 0xd0e2ef,
    roughness: 0.65
  });

  const darkMat = new THREE.MeshStandardMaterial({
    color: 0x334b68,
    roughness: 0.55
  });

  const cyanMat = new THREE.MeshStandardMaterial({
    color: 0x20eaff,
    emissive: 0x00bce5,
    emissiveIntensity: 1.5
  });

  const pinkMat = new THREE.MeshStandardMaterial({
    color: 0xff69d8,
    emissive: 0xe900a8,
    emissiveIntensity: 1.1
  });

  // SUELO
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(90, 90),
    floorMat
  );

  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // CUADRÍCULA VISIBLE
  const grid = new THREE.GridHelper(90, 45, 0x12a8cc, 0x648ba5);
  grid.position.y = 0.025;
  scene.add(grid);

  // CREAR OBJETOS
  function box(w, h, d, x, y, z, material) {
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      material
    );

    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    return mesh;
  }

  // PAREDES DE LA ARENA
  box(90, 8, 2, 0, 4, -45, wallMat);
  box(90, 8, 2, 0, 4, 45, wallMat);
  box(2, 8, 90, -45, 4, 0, wallMat);
  box(2, 8, 90, 45, 4, 0, wallMat);

  // BORDES DE NEÓN
  box(90, 0.25, 0.3, 0, 7.7, -43.8, cyanMat);
  box(90, 0.25, 0.3, 0, 7.7, 43.8, pinkMat);
  box(0.3, 0.25, 90, -43.8, 7.7, 0, cyanMat);
  box(0.3, 0.25, 90, 43.8, 7.7, 0, pinkMat);

  // COLUMNAS: dejamos libre la zona de aparición
  for (let x = -32; x <= 32; x += 16) {
    for (let z = -32; z <= 32; z += 16) {
      if (Math.abs(x) < 10 && z > 10) continue;

      box(2.5, 7, 2.5, x, 3.5, z, darkMat);
      box(2.7, 0.2, 2.7, x, 7.1, z, cyanMat);
      box(2.7, 0.2, 2.7, x, 0.2, z, pinkMat);
    }
  }

  // PLATAFORMAS DECORATIVAS
  box(10, 0.8, 8, -20, 0.4, -12, darkMat);
  box(10, 0.8, 8, 20, 0.4, -12, darkMat);
  box(0.4, 0.15, 8, -20, 0.9, -12, cyanMat);
  box(0.4, 0.15, 8, 20, 0.9, -12, pinkMat);

  // CRISTALES PARA RECOGER
  const crystals = [];

  const crystalMat = new THREE.MeshStandardMaterial({
    color: 0x75ffff,
    emissive: 0x00ccff,
    emissiveIntensity: 2.2,
    metalness: 0.15,
    roughness: 0.2
  });

  const crystalPositions = [
    [-25, -25], [-15, -30], [0, -30], [15, -30],
    [28, -25], [-30, -10], [-12, -5], [12, -5],
    [30, 5], [-30, 20], [-15, 25], [0, 20],
    [15, 25], [30, 30], [0, -15], [0, 35]
  ];

  for (const [x, z] of crystalPositions) {
    const crystal = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.8, 0),
      crystalMat
    );

    crystal.position.set(x, 1.5, z);
    crystal.castShadow = true;
    scene.add(crystal);
    crystals.push({
      mesh: crystal,
      baseY: 1.5,
      collected: false
    });
  }

  // JUGADOR
  const player = {
    x: 0,
    y: 1.7,
    z: 30,
    yaw: 0,
    pitch: 0,
    verticalSpeed: 0,
    grounded: true
  };

  const keys = {};
  let started = false;
  let score = 0;
  let lastTime = performance.now();

  const PLAYER_HEIGHT = 1.7;
  const ARENA_LIMIT = 41;
  const obstacles = [];

  // Obstáculos sólidos para el movimiento
  for (let x = -32; x <= 32; x += 16) {
    for (let z = -32; z <= 32; z += 16) {
      if (Math.abs(x) < 10 && z > 10) continue;
      obstacles.push({ x, z, r: 1.65 });
    }
  }

  function blocked(x, z) {
    if (
      x < -ARENA_LIMIT || x > ARENA_LIMIT ||
      z < -ARENA_LIMIT || z > ARENA_LIMIT
    ) return true;

    for (const o of obstacles) {
      if (Math.hypot(x - o.x, z - o.z) < o.r) {
        return true;
      }
    }

    return false;
  }

  function syncCamera() {
    camera.position.set(player.x, player.y, player.z);
    camera.rotation.order = "YXZ";
    camera.rotation.y = player.yaw;
    camera.rotation.x = player.pitch;
  }

  // CONTROLES DE TECLADO
  window.addEventListener("keydown", (e) => {
    keys[e.code] = true;

    if (
      ["Space", "ArrowUp", "ArrowDown",
       "ArrowLeft", "ArrowRight"].includes(e.code)
    ) {
      e.preventDefault();
    }
  });

  window.addEventListener("keyup", (e) => {
    keys[e.code] = false;
  });

  window.addEventListener("blur", () => {
    for (const key in keys) keys[key] = false;
  });

  // MIRAR CON EL RATÓN
  document.addEventListener("mousemove", (e) => {
    if (!started || document.pointerLockElement !== renderer.domElement) {
      return;
    }

    player.yaw -= e.movementX * 0.002;
    player.pitch -= e.movementY * 0.002;

    player.pitch = Math.max(
      -1.45,
      Math.min(1.45, player.pitch)
    );
  });

  // ENTRAR EN EL JUEGO
  playButton.addEventListener("click", () => {
    started = true;
    menu.style.display = "none";
    statusText.textContent = "Jugando";

    renderer.domElement.requestPointerLock();
    syncCamera();
  });

  document.addEventListener("pointerlockchange", () => {
    if (document.pointerLockElement !== renderer.domElement) {
      menu.style.display = "flex";
      statusText.textContent = "Pausado";
    } else {
      menu.style.display = "none";
      statusText.textContent = "Jugando";
    }
  });

  // ACTUALIZAR MOVIMIENTO
  function update(dt) {
    if (!started) return;

    const forward =
      (keys.KeyW || keys.ArrowUp ? 1 : 0) -
      (keys.KeyS || keys.ArrowDown ? 1 : 0);

    const side =
      (keys.KeyD || keys.ArrowRight ? 1 : 0) -
      (keys.KeyA || keys.ArrowLeft ? 1 : 0);

    const length = Math.hypot(forward, side) || 1;
    const f = forward / length;
    const s = side / length;

    const speed =
      keys.ShiftLeft || keys.ShiftRight ? 12 : 7;

    const dx = (
      -Math.sin(player.yaw) * f +
       Math.cos(player.yaw) * s
    ) * speed * dt;

    const dz = (
      -Math.cos(player.yaw) * f -
       Math.sin(player.yaw) * s
    ) * speed * dt;

    // Colisión por ejes
    if (!blocked(player.x + dx, player.z)) {
      player.x += dx;
    }

    if (!blocked(player.x, player.z + dz)) {
      player.z += dz;
    }

    // SALTO Y GRAVEDAD
    if (keys.Space && player.grounded) {
      player.verticalSpeed = 8;
      player.grounded = false;
    }

    player.verticalSpeed -= 20 * dt;
    player.y += player.verticalSpeed * dt;

    if (player.y <= PLAYER_HEIGHT) {
      player.y = PLAYER_HEIGHT;
      player.verticalSpeed = 0;
      player.grounded = true;
    }

    syncCamera();

    // RECOGER CRISTALES
    for (const crystal of crystals) {
      if (crystal.collected) continue;

      const dx = player.x - crystal.mesh.position.x;
      const dz = player.z - crystal.mesh.position.z;

      if (Math.hypot(dx, dz) < 1.6 &&
          Math.abs(player.y - crystal.baseY) < 3) {
        crystal.collected = true;
        scene.remove(crystal.mesh);
        score++;
        scoreText.textContent = score;
        message.textContent = "¡Cristal conseguido!";

        if (score === crystals.length) {
          message.textContent = "¡HAS CONSEGUIDO TODOS LOS CRISTALES!";
        }
      }
    }
  }

  // ANIMACIÓN
  function animate(now) {
    requestAnimationFrame(animate);

    const dt = Math.min((now - lastTime) / 1000, 0.04);
    lastTime = now;

    update(dt);

    for (const crystal of crystals) {
      if (crystal.collected) continue;

      crystal.mesh.rotation.y += dt * 1.5;
      crystal.mesh.rotation.x += dt * 0.4;
      crystal.mesh.position.y =
        crystal.baseY + Math.sin(now * 0.002 + crystal.mesh.position.x) * 0.25;
    }

    blueLight.position.x = Math.sin(now * 0.0005) * 25;
    pinkLight.position.z = Math.cos(now * 0.0006) * 25;

    renderer.render(scene, camera);
  }

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  syncCamera();
  requestAnimationFrame(animate);
})();
</script>

</body>
</html>
