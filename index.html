}

.logo-icon {
  width: 36px;
  height: 36px;

}

#brandText {

  font-size: 13px;
}

#crosshair {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 25px;
  color: white;
  text-shadow: 0 0 8px #00eaff;
}

#help {
  position: absolute;
  bottom: 10px;
  left: 10px;
  padding: 10px;
  background: #0b1424e8;
  border: 1px solid #35dfff55;
  border-radius: 9px;
  font-size: 12px;

}

#toast {
  position: absolute;
  top: 65%;
  left: 50%;
  transform: translateX(-50%);
  color: #ffe477;
  font-weight: 900;
  text-shadow: 0 0 12px #ffae00;
  white-space: nowrap;
}

#start {

  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  background: radial-gradient(ellipse, #173b5a, #040711 75%);
  overflow: auto;
}

#card {
  width: min(700px, 100%);
  max-height: 96vh;
  overflow: auto;
  text-align: center;
  padding: 20px;
  background: #101827f5;
  border: 1px solid #32dfff;
  border-radius: 18px;
  box-shadow: 0 0 35px #00bfff30;
}

h1 {
  color: #42eaff;
  text-shadow: 0 0 18px #00bfff;
  margin: 5px;
}

h2 {
  font-size: 14px;
  color: #78eaff;
  margin: 15px 0 8px;
}

.small {
  font-size: 12px;
  color: #a8c8dc;
}

.choices {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 10px 0;
}

.choice {
  padding: 12px 5px;
  border: 1px solid #38516b;
  border-radius: 10px;
  background: #0b1321;
  cursor: pointer;
  font-size: 12px;
}

.choice.selected {
  border: 2px solid #42eaff;
  box-shadow: 0 0 12px #00bfff55;
}

.swatch {
  height: 30px;
  width: 30px;
  border-radius: 50%;
  margin: 0 auto 7px;
  box-shadow: 0 0 12px currentColor;
}

input {
  width: 100%;
  padding: 12px;
  margin: 5px 0;
  background: #070d18;
  border: 1px solid #38516b;
  border-radius: 8px;
  color: white;
}
